<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUC Live Translator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070707;
      --panel: #111111;
      --panel-strong: #171717;
      --line: #2b2b2b;
      --line-soft: #1d1d1d;
      --muted: #949494;
      --text: #f7f7f5;
      --accent: #ff6b00;
      --accent-bright: #ff7a1a;
      --danger: #ff4f4f;
      --subtitle-size: 42px;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% -20%, rgba(255, 107, 0, .14), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, select, input { font: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    header {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(310px, 1fr) auto;
      align-items: center;
      gap: 28px;
      padding: 15px clamp(18px, 3vw, 44px);
      border-bottom: 1px solid var(--line);
      background: rgba(7, 7, 7, .88);
      backdrop-filter: blur(18px);
    }
    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: clamp(14px, 2vw, 24px);
    }
    .brand-logo {
      display: block;
      width: clamp(178px, 17vw, 238px);
      height: auto;
      flex: 0 0 auto;
    }
    .product-name {
      padding-left: clamp(14px, 2vw, 24px);
      border-left: 1px solid #3a3a3a;
      min-width: 0;
    }
    .product-name strong {
      display: block;
      font-size: 13px;
      line-height: 1.1;
      letter-spacing: .18em;
      white-space: nowrap;
    }
    .product-name span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .045em;
      white-space: nowrap;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }
    select, button, input {
      color: var(--text);
      background: #151515;
      border: 1px solid #353535;
      border-radius: 8px;
      min-height: 44px;
    }
    select { max-width: 230px; padding: 0 34px 0 12px; }
    button {
      padding: 0 15px;
      font-weight: 680;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    button:hover:not(:disabled) { background: #222; border-color: #505050; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 3px solid rgba(255, 107, 0, .3);
      outline-offset: 2px;
    }
    button:disabled { cursor: wait; opacity: .62; }
    button.primary {
      position: relative;
      min-width: 88px;
      padding-left: 34px;
      color: #110700;
      background: var(--accent);
      border-color: var(--accent);
    }
    button.primary::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      transform: translateY(-50%);
    }
    button.primary:hover:not(:disabled) { background: var(--accent-bright); border-color: var(--accent-bright); }
    button.primary.recording { background: var(--danger); border-color: var(--danger); color: #170000; }
    button.primary.recording::before { animation: pulse 1.3s ease-out infinite; }
    .font-control {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 11px;
      color: var(--muted);
      background: #111;
      border: 1px solid #303030;
      border-radius: 8px;
      font-size: 12px;
    }
    #font-size { width: 76px; min-height: 0; accent-color: var(--accent); }
    main {
      display: grid;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 1px;
      min-height: 0;
      padding: 1px 0;
      background: var(--line-soft);
    }
    .track {
      position: relative;
      display: grid;
      grid-template-columns: minmax(118px, 13vw) 1fr;
      align-items: center;
      gap: clamp(22px, 4vw, 64px);
      padding: clamp(24px, 3.4vh, 48px) clamp(24px, 5vw, 78px);
      overflow: hidden;
      background: var(--panel);
      isolation: isolate;
    }
    .track::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--accent);
      opacity: 0;
      transform: scaleY(.25);
      transition: opacity .2s ease, transform .2s ease;
    }
    .track.active {
      background:
        linear-gradient(90deg, rgba(255, 107, 0, .09), transparent 30%),
        var(--panel-strong);
    }
    .track.active::after { opacity: 1; transform: scaleY(1); }
    .language {
      align-self: start;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 8px;
      color: #b0b0b0;
      font-size: 13px;
      font-weight: 760;
      letter-spacing: .14em;
    }
    .language-native {
      color: var(--text);
      font-size: clamp(18px, 1.5vw, 23px);
      font-weight: 720;
      letter-spacing: -.015em;
    }
    .source-badge {
      display: none;
      width: max-content;
      padding: 4px 7px;
      border: 1px solid rgba(255, 107, 0, .45);
      border-radius: 4px;
      color: var(--accent-bright);
      font-size: 9px;
      letter-spacing: .16em;
    }
    .track.active .source-badge { display: inline-block; }
    .subtitle {
      font-size: var(--subtitle-size);
      line-height: 1.22;
      font-weight: 610;
      letter-spacing: -.025em;
      overflow-wrap: anywhere;
    }
    .subtitle.empty { color: #555; font-weight: 500; }
    .partial { color: #969696; font-weight: 500; }
    footer {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 6px clamp(18px, 3vw, 44px);
      border-top: 1px solid var(--line);
      color: #6f6f6f;
      background: #090909;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .status { display: flex; align-items: center; gap: 8px; color: #a2a2a2; letter-spacing: .04em; text-transform: none; }
    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(255, 107, 0, .11);
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(23, 0, 0, .55); }
      70%, 100% { box-shadow: 0 0 0 7px rgba(23, 0, 0, 0); }
    }
    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; gap: 13px; }
      .controls { justify-content: stretch; }
      select { min-width: 0; max-width: none; flex: 1 1 180px; }
      main { min-height: 720px; }
    }
    @media (max-width: 680px) {
      .app { display: block; }
      header { position: sticky; top: 0; padding: 13px 15px; }
      .brand-logo { width: 174px; }
      .product-name strong { font-size: 11px; }
      .product-name span { display: none; }
      .controls { display: grid; grid-template-columns: 1fr auto auto; }
      .font-control { display: none; }
      #fullscreen-button { padding-inline: 12px; }
      main { display: block; min-height: 0; padding: 0; }
      .track {
        min-height: 235px;
        grid-template-columns: 1fr;
        align-content: center;
        gap: 15px;
        padding: 25px 22px 31px;
        border-bottom: 1px solid var(--line-soft);
      }
      .language { padding-top: 0; flex-direction: row; align-items: center; }
      .language-native { font-size: 17px; }
      .subtitle { font-size: min(var(--subtitle-size), 8.2vw); line-height: 1.28; }
      footer { position: static; padding-inline: 15px; }
      footer > span:first-child { display: none; }
    }
    @media (max-width: 440px) {
      .brand-logo { width: 148px; }
      .product-name { padding-left: 11px; }
      .product-name strong { letter-spacing: .12em; }
      .controls { grid-template-columns: 1fr auto; }
      #fullscreen-button { display: none; }
    }
    :fullscreen header { opacity: .13; transition: opacity .2s; }
    :fullscreen header:hover { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand" aria-label="Solo Unicorn Club — SUC Live Translator">
        <img class="brand-logo" src="{{SUC_LOGO_DATA_URI}}" alt="Solo Unicorn Club" />
        <div class="product-name">
          <strong>LIVE TRANSLATOR</strong>
          <span>中文 · ENGLISH · 日本語</span>
        </div>
      </div>
      <div class="controls">
        <select id="microphone-select" aria-label="Microphone">
          <option value="">Default microphone</option>
        </select>
        <label class="font-control" aria-label="Subtitle size">A <input id="font-size" type="range" min="26" max="72" value="42" /> A+</label>
        <button id="fullscreen-button" type="button">Fullscreen</button>
        <button id="record-button" class="primary" type="button">Start</button>
      </div>
    </header>
    <main>
      <section class="track" id="track-zh">
        <div class="language"><span class="language-native">中文</span><span>CHINESE</span><span class="source-badge">SOURCE</span></div>
        <div class="subtitle empty" id="subtitle-zh">等待发言…</div>
      </section>
      <section class="track" id="track-en">
        <div class="language"><span class="language-native">English</span><span>ENGLISH</span><span class="source-badge">SOURCE</span></div>
        <div class="subtitle empty" id="subtitle-en">Waiting for speech…</div>
      </section>
      <section class="track" id="track-ja">
        <div class="language"><span class="language-native">日本語</span><span>JAPANESE</span><span class="source-badge">SOURCE</span></div>
        <div class="subtitle empty" id="subtitle-ja">発言を待っています…</div>
      </section>
    </main>
    <footer>
      <span>Local · Private · On device</span>
      <span class="status" id="status" role="status" aria-live="polite">Ready</span>
    </footer>
  </div>
  <script>
    const languages = ["zh", "en", "ja"];
    const placeholders = { zh: "等待发言…", en: "Waiting for speech…", ja: "発言を待っています…" };
    const microphoneSelect = document.getElementById("microphone-select");
    const recordButton = document.getElementById("record-button");
    const fullscreenButton = document.getElementById("fullscreen-button");
    const fontSize = document.getElementById("font-size");
    const statusElement = document.getElementById("status");
    let websocket = null;
    let recorder = null;
    let mediaStream = null;
    let recording = false;
    let translationTimer = null;
    let translationAbort = null;
    let requestedFingerprint = "";
    let currentSourceLanguage = null;
    const translationCache = new Map();

    function setStatus(message) { statusElement.textContent = message; }

    function setTrack(language, text, { active = false, partial = "" } = {}) {
      const track = document.getElementById(`track-${language}`);
      const subtitle = document.getElementById(`subtitle-${language}`);
      track.classList.toggle("active", active);
      subtitle.classList.toggle("empty", !text && !partial);
      subtitle.replaceChildren();
      if (text) subtitle.append(document.createTextNode(text));
      if (partial) {
        if (text && !/\s$/u.test(text)) subtitle.append(document.createTextNode(" "));
        const span = document.createElement("span");
        span.className = "partial";
        span.textContent = partial;
        subtitle.append(span);
      }
      if (!text && !partial) subtitle.textContent = placeholders[language];
    }

    function showTranslated(result) {
      currentSourceLanguage = result.source_language;
      for (const language of languages) {
        setTrack(language, result.subtitles[language] || "", {
          active: language === currentSourceLanguage,
        });
      }
    }

    async function requestTranslation(text, detectedLanguage, fingerprint) {
      const cached = translationCache.get(fingerprint);
      if (cached) {
        showTranslated(cached);
        return;
      }
      if (translationAbort) translationAbort.abort();
      translationAbort = new AbortController();
      setStatus("Translating locally…");
      try {
        const response = await fetch("/conference/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, source_language: detectedLanguage }),
          signal: translationAbort.signal,
        });
        if (response.status === 409) return;
        if (!response.ok) throw new Error(await response.text());
        const result = await response.json();
        translationCache.set(fingerprint, result);
        if (requestedFingerprint === fingerprint) showTranslated(result);
        setStatus("Listening");
      } catch (error) {
        if (error.name !== "AbortError") {
          console.error(error);
          setStatus("Translation unavailable; source captions continue");
        }
      }
    }

    function latestPhrase(text) {
      const characters = Array.from(text.trim());
      if (characters.length <= 400) return characters.join("");
      const tail = characters.slice(-400).join("");
      const boundary = tail.search(/[.!?。！？]\s*/u);
      return (boundary >= 0 ? tail.slice(boundary + 1) : tail).trim();
    }

    function scheduleTranslation(text, detectedLanguage) {
      const phrase = latestPhrase(text);
      if (!phrase) return;
      const source = languages.includes(detectedLanguage) ? detectedLanguage : "auto";
      const fingerprint = `${source}\u0000${phrase}`;
      if (fingerprint === requestedFingerprint) return;
      requestedFingerprint = fingerprint;
      clearTimeout(translationTimer);
      const delay = /[.!?。！？]$/u.test(phrase) ? 80 : 700;
      translationTimer = setTimeout(
        () => requestTranslation(phrase, detectedLanguage, fingerprint),
        delay,
      );
    }

    function handleTranscript(data) {
      if (data.status === "error") {
        setStatus(data.error || "Transcription error");
        return;
      }
      const speechLines = (data.lines || []).filter(line => line.speaker !== -2 && line.text);
      const latest = speechLines.at(-1);
      const committed = latest ? latest.text.trim() : "";
      const partial = (data.buffer_transcription || "").trim();
      const source = languages.includes(latest?.detected_language)
        ? latest.detected_language
        : currentSourceLanguage;
      if (source && (committed || partial)) {
        setTrack(source, committed, { active: true, partial });
        for (const language of languages) {
          document.getElementById(`track-${language}`).classList.toggle("active", language === source);
        }
      }
      if (committed) scheduleTranslation(committed, latest?.detected_language);
    }

    async function refreshMicrophones(askPermission = false) {
      if (askPermission) {
        const permissionStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        permissionStream.getTracks().forEach(track => track.stop());
      }
      const devices = await navigator.mediaDevices.enumerateDevices();
      const microphones = devices.filter(device => device.kind === "audioinput");
      const selected = microphoneSelect.value;
      microphoneSelect.replaceChildren(new Option("Default microphone", ""));
      microphones.forEach((device, index) => {
        microphoneSelect.append(new Option(device.label || `Microphone ${index + 1}`, device.deviceId));
      });
      microphoneSelect.value = selected;
    }

    function websocketUrl() {
      const protocol = location.protocol === "https:" ? "wss" : "ws";
      return `${protocol}://${location.host}/asr?language=auto`;
    }

    function recorderOptions() {
      const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
      const mimeType = candidates.find(type => MediaRecorder.isTypeSupported(type));
      return mimeType ? { mimeType } : undefined;
    }

    async function requestMicrophoneStream(constraints) {
      const mediaPromise = navigator.mediaDevices.getUserMedia(constraints);
      let timedOut = false;
      let timeoutId = null;
      const timeoutPromise = new Promise((_, reject) => {
        timeoutId = setTimeout(() => {
          timedOut = true;
          const error = new Error("Microphone permission timed out");
          error.name = "TimeoutError";
          reject(error);
        }, 10000);
      });
      try {
        return await Promise.race([mediaPromise, timeoutPromise]);
      } finally {
        clearTimeout(timeoutId);
        if (timedOut) {
          mediaPromise.then(
            stream => stream.getTracks().forEach(track => track.stop()),
            () => {},
          );
        }
      }
    }

    async function startRecording() {
      setStatus("Connecting…");
      const constraints = microphoneSelect.value
        ? { audio: { deviceId: { exact: microphoneSelect.value }, echoCancellation: true } }
        : { audio: { echoCancellation: true } };
      const permissionHintTimer = setTimeout(
        () => setStatus("Please allow microphone access in the browser…"),
        2000,
      );
      try {
        mediaStream = await requestMicrophoneStream(constraints);
      } finally {
        clearTimeout(permissionHintTimer);
      }
      await refreshMicrophones(false);
      websocket = new WebSocket(websocketUrl());
      websocket.onmessage = event => {
        const data = JSON.parse(event.data);
        if (data.type === "config" && data.useAudioWorklet) {
          setStatus("Conference page requires server mode without --pcm-input");
          stopRecording();
        } else if (data.type === "ready_to_stop") {
          websocket.close();
          setStatus("Stopped");
        } else if (data.type === "error") {
          setStatus(data.error || "Server error");
        } else if (!data.type) {
          handleTranscript(data);
        }
      };
      websocket.onerror = () => setStatus("Cannot connect to local server");
      await new Promise((resolve, reject) => {
        websocket.onopen = resolve;
        const prior = websocket.onerror;
        websocket.onerror = event => { prior(event); reject(new Error("WebSocket connection failed")); };
      });
      recorder = new MediaRecorder(mediaStream, recorderOptions());
      recorder.ondataavailable = event => {
        if (event.data.size && websocket?.readyState === WebSocket.OPEN) websocket.send(event.data);
      };
      recorder.start(250);
      recording = true;
      recordButton.textContent = "Stop";
      recordButton.classList.add("recording");
      setStatus("Listening");
    }

    async function stopRecording() {
      if (recorder && recorder.state !== "inactive") {
        await new Promise(resolve => {
          recorder.addEventListener("stop", resolve, { once: true });
          recorder.stop();
        });
      }
      if (websocket?.readyState === WebSocket.OPEN) websocket.send(new ArrayBuffer(0));
      mediaStream?.getTracks().forEach(track => track.stop());
      recorder = null;
      mediaStream = null;
      recording = false;
      recordButton.textContent = "Start";
      recordButton.classList.remove("recording");
      setStatus("Finishing last phrase…");
    }

    recordButton.addEventListener("click", async () => {
      recordButton.disabled = true;
      try {
        if (recording) await stopRecording();
        else await startRecording();
      } catch (error) {
        console.error(error);
        mediaStream?.getTracks().forEach(track => track.stop());
        recording = false;
        recordButton.textContent = "Start";
        recordButton.classList.remove("recording");
        if (error?.name === "NotAllowedError") {
          setStatus("Microphone blocked — allow access, then click Start again");
        } else if (error?.name === "TimeoutError") {
          setStatus("Microphone permission timed out — allow access, then retry");
        } else {
          setStatus("Microphone or server unavailable");
        }
      } finally {
        recordButton.disabled = false;
      }
    });
    fullscreenButton.addEventListener("click", () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });
    fontSize.addEventListener("input", () => {
      document.documentElement.style.setProperty("--subtitle-size", `${fontSize.value}px`);
    });
    if (location.protocol === "file:") {
      recordButton.disabled = true;
      setStatus("Start the server, then open the Conference URL printed in Terminal");
    } else {
      navigator.mediaDevices?.addEventListener?.("devicechange", () => refreshMicrophones(false));
      refreshMicrophones(false).catch(() => {});
    }
  </script>
</body>
</html>
